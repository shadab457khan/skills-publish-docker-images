name: Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build \
            --tag ghcr.io/shadab457khan/skills-publish-docker-images/stackoverflown:main \
            .

      - name: Push Docker image
        run: |
          for attempt in 1 2 3; do
            if docker push ghcr.io/shadab457khan/skills-publish-docker-images/stackoverflown:main; then
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done

          exit 1